<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPS Survey TEST</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
           margin: 0; background: #f6f7f9; color: #111; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 18px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .sub { font-size: 13px; color: #555; margin-bottom: 16px; line-height: 1.5; }
    .scoreBox { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 10px; }
    .score { font-size: 42px; font-weight: 800; }
    .label { font-size: 14px; color: #444; }
    textarea { width: 100%; min-height: 120px; padding: 12px; border-radius: 10px; border: 1px solid #ddd;
               font-size: 14px; resize: vertical; box-sizing: border-box; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 12px 14px; font-weight: 700; cursor: pointer; }
    .primary { background: #06c755; color: #fff; }
    .primary:disabled { opacity: .55; cursor: not-allowed; }
    .ghost { background: #eef1f4; color: #111; }
    .msg { margin-top: 12px; font-size: 13px; line-height: 1.6; }
    .ok { color: #0a7a2f; }
    .ng { color: #b00020; }
    .muted { color: #666; font-size: 12px; margin-top: 10px; }
    code { background: #f1f1f1; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>アンケート</h1>
      <div class="sub">
        ありがとうございます。よろしければ、スコアの理由を一言だけ教えてください（任意）。
      </div>

      <div class="scoreBox">
        <div class="score" id="scoreText">-</div>
        <div class="label" id="scoreLabel">スコアを読み込み中…</div>
      </div>

      <textarea id="comment" placeholder="例：説明がわかりやすかった / 宿題の量がちょうど良い など（任意）"></textarea>

      <div class="row">
        <button class="primary" id="sendBtn">送信する</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="ghost" id="resetBtn" type="button">入力をクリア</button>
      </div>

      <div class="msg" id="msg"></div>

    </div>
  </div>

<script>
const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzr-aA_mnP_sHV4ablOWEiCAg5KXpKdWt3kFcXzYm9k6pM8t0-tLARcI5o-qEfYwb4y/exec";

function setMsg(text, cls) {
  const el = document.getElementById("msg");
  el.className = "msg " + (cls || "");
  el.textContent = text;
}

function getQueryParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}
function parseScore(raw) {
  if (raw === null || raw === undefined || raw === "") return null;
  const n = Number(raw);
  if (!Number.isInteger(n) || n < 0 || n > 10) return null;
  return n;
}
function setScoreUI(score) {
  const scoreText = document.getElementById("scoreText");
  const scoreLabel = document.getElementById("scoreLabel");
  if (score === null) {
    scoreText.textContent = "-";
    scoreLabel.textContent = "スコア不明";
    return;
  }
  scoreText.textContent = String(score);
  scoreLabel.textContent = `スコア${score}の理由（任意）`;
}

/**
 * ★ページ遷移しないフォーム送信（iframeターゲット）
 * - CORS/プリフライト回避
 * - 画面はそのまま
 * - GASの返却JSONを読み取って成功/失敗表示する
 */
function postByHiddenIframe(url, payload) {
  return new Promise((resolve, reject) => {
    // 使い回し用 iframe（無ければ作る）
    let iframe = document.getElementById("hiddenPostFrame");
    if (!iframe) {
      iframe = document.createElement("iframe");
      iframe.id = "hiddenPostFrame";
      iframe.name = "hiddenPostFrame";
      iframe.style.display = "none";
      document.body.appendChild(iframe);
    }

    // form（無ければ作る）
    let form = document.getElementById("hiddenPostForm");
    if (!form) {
      form = document.createElement("form");
      form.id = "hiddenPostForm";
      form.method = "POST";
      form.style.display = "none";
      document.body.appendChild(form);
    }

    form.action = url;
    form.target = "hiddenPostFrame";
    form.innerHTML = "";

    for (const [k, v] of Object.entries(payload)) {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = k;
      input.value = (v ?? "").toString();
      form.appendChild(input);
    }

    // iframe に読み込みが入ったら結果を読む
    const onLoad = () => {
      try {
        // GASから返るのは {"ok":true} のJSON文字列
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const text = (doc.body && doc.body.innerText) ? doc.body.innerText.trim() : "";
        // 空っぽの時もあるのでガード
        if (!text) {
          resolve({ ok: true, raw: "" }); // 返事が空でも送れてることがある
          return;
        }
        let json = null;
        try { json = JSON.parse(text); } catch (_) {}
        if (json && json.ok === true) resolve({ ok: true, raw: text });
        else resolve({ ok: false, raw: text });
      } catch (e) {
        // まれに読めない場合でも「送信自体は成功」しているケースがあるため、成功扱いに寄せる
        resolve({ ok: true, raw: "" });
      } finally {
        iframe.removeEventListener("load", onLoad);
      }
    };

    iframe.addEventListener("load", onLoad);

    try {
      form.submit();
    } catch (e) {
      iframe.removeEventListener("load", onLoad);
      reject(e);
    }
  });
}

(async function init() {
  const score = parseScore(getQueryParam("score"));
  setScoreUI(score);

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.addEventListener("click", async () => {
    if (score === null) {
      setMsg("score が入力されていません。", "ng");
      return;
    }

    sendBtn.disabled = true;
    setMsg("送信中…", "");

    const payload = {
      userId: "TEST_USER",
      customerName: "テスト太郎",
      classId: "test_class_001",
      score: String(score),
      comment: (document.getElementById("comment").value || "").trim(),
      source: "WEB_TEST"
    };

    try {
      const result = await postByHiddenIframe(GAS_ENDPOINT_URL, payload);
      if (result.ok) {
        setMsg("ご協力ありがとうございました！", "ok");
        // 送信後に入力欄をロックしたいなら↓
        // document.getElementById("comment").disabled = true;
      } else {
        setMsg("送信に失敗しました。\n応答: " + result.raw, "ng");
      }
    } catch (e) {
      setMsg("送信に失敗しました。\n" + String(e), "ng");
    } finally {
      sendBtn.disabled = false;
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    document.getElementById("comment").value = "";
    setMsg("", "");
  });
})();
</script>



  

</body>
</html>
